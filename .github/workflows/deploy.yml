name: Deploy WattFlow (VPS Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Evita deploys concorrentes simultâneos
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy Remoto na VPS
        uses: appleboy/ssh-action@7eaf766715f9fa35d9f96717cac38575007909cf # v1.2.0
        env:
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: VPS_TARGET_DIR
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 [WattFlow CI/CD] Iniciando deploy da branch main..."

            # 1. Navegar até o diretório do projeto na VPS
            TARGET_DIR="${VPS_TARGET_DIR:-/opt/wattflow}"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "❌ Diretório de deploy $TARGET_DIR não encontrado na VPS."
              exit 1
            fi
            cd "$TARGET_DIR"

            # Configurar safe.directory para evitar bloqueio por dono diferente (root vs site-user)
            git config --global --add safe.directory "$TARGET_DIR"

            # 2. Atualizar repositório Git com a branch main
            if [ ! -d ".git" ]; then
              echo "📦 Repositório git não encontrado em $TARGET_DIR. Clonando..."
              git init -b main
              git remote add origin https://github.com/saulobraine/wattflow.git || git remote set-url origin https://github.com/saulobraine/wattflow.git
            fi

            echo "📥 Atualizando código fonte com git pull origin main..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Garantir existência e permissões estritas do arquivo .env
            if [ ! -f .env ]; then
              echo "❌ Arquivo .env não encontrado em $TARGET_DIR. Configure o .env antes do deploy."
              exit 1
            fi
            chmod 600 .env

            # 4. Reconstruir e subir os contêineres de forma graciosa (sem matar o banco de dados postgres)
            echo "🔨 Compilando e atualizando contêineres Docker..."
            docker compose config -q
            docker compose build app
            docker compose up -d --remove-orphans --wait

            # 5. Limpar imagens antigas para poupar espaço em disco da VPS
            echo "🧹 Limpando imagens Docker órfãs..."
            docker image prune -f

            # 6. Validar saúde dos serviços
            echo "🩺 Verificando status dos contêineres..."
            docker compose ps

            echo "✅ Deploy concluído com sucesso para wattflow.braine.dev!"
