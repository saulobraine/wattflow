<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Fundo dark slate navy com gradiente sutil -->
    <linearGradient id="wf-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Brilho / Glow sutil esmeralda neon -->
    <filter id="wf-zap-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Squircle com cantos arredondados, fundo dark e borda sutil esmeralda -->
  <rect
    x="1.5"
    y="1.5"
    width="29"
    height="29"
    rx="7.5"
    fill="url(#wf-bg)"
    stroke="#10b981"
    stroke-width="1.2"
    stroke-opacity="0.4"
  />

  <!-- Preenchimento suave esmeralda no interior do squircle (efeito bg-emerald-500/10) -->
  <rect
    x="1.5"
    y="1.5"
    width="29"
    height="29"
    rx="7.5"
    fill="#10b981"
    fill-opacity="0.08"
  />

  <!-- Ícone Oficial Lucide Zap (Raio vazado, traço esmeralda neon encorpado) -->
  <g transform="translate(4, 4) scale(1)">
    <path
      d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"
      fill="none"
      stroke="#34d399"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#wf-zap-glow)"
    />
  </g>
</svg>
