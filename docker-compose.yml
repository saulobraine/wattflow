services:
  # -------------------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL (100% Isolado na Rede Interna do WattFlow)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wattflow_postgres
    restart: unless-stopped
    networks:
      - wattflow_isolated_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wattflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-wattflow}
    # Sem exposição de portas no host: o banco só aceita conexões da rede interna wattflow_isolated_net
    # Caso precise inspecionar via tunnel SSH local, descomente a linha abaixo:
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wattflow} -d ${POSTGRES_DB:-wattflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # -------------------------------------------------------------------------
  # 2. Aplicação WattFlow (Next.js Pages Router + Prisma)
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wattflow_app
    restart: unless-stopped
    networks:
      - wattflow_isolated_net
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Expõe apenas no loopback (127.0.0.1) em porta dedicada (padrão 3050) para evitar colisão com apps na 3000
      - "${APP_BIND_IP:-127.0.0.1}:${APP_HOST_PORT:-3050}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-wattflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wattflow}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-wattflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-wattflow}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CRON_SECRET_TOKEN: ${CRON_SECRET_TOKEN:?CRON_SECRET_TOKEN is required}
      DISABLE_LOCAL_CRON: ${DISABLE_LOCAL_CRON:-false}
      PORT: 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M

  # -------------------------------------------------------------------------
  # 3. Agendador Automático do Cron Job (Sync Periódico de Energia)
  # -------------------------------------------------------------------------
  cron-scheduler:
    image: alpine:3.20
    container_name: wattflow_cron
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    networks:
      - wattflow_isolated_net
    depends_on:
      app:
        condition: service_healthy
    environment:
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-300}
      CRON_SECRET_TOKEN: ${CRON_SECRET_TOKEN:?CRON_SECRET_TOKEN is required}
      DISABLE_LOCAL_CRON: ${DISABLE_LOCAL_CRON:-false}
    command:
      - /bin/sh
      - -c
      - |
        echo "=== [WattFlow Cron] Agendador automatico iniciado ==="
        if [ "$${DISABLE_LOCAL_CRON}" = "true" ]; then
          echo "Cron desativado via DISABLE_LOCAL_CRON=true"
          exec sleep infinity
        fi
        echo "Disparando inicializacao do stream MQTT..."
        wget -q -O - --header="Authorization: Bearer $${CRON_SECRET_TOKEN}" "http://app:3000/api/mqtt-stream" || echo "Falha ao inicializar stream MQTT"
        while true; do
          sleep $${WATCHDOG_INTERVAL_SECONDS:-300}
          echo "Watchdog: verificando/reiniciando stream MQTT..."
          wget -q -O - --header="Authorization: Bearer $${CRON_SECRET_TOKEN}" "http://app:3000/api/mqtt-stream" || echo "Falha ao acionar rota /api/mqtt-stream"
          echo ""
        done
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  wattflow_isolated_net:
    name: wattflow_isolated_net
    driver: bridge

volumes:
  postgres_data:
    name: wattflow_postgres_data
