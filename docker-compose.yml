name: wattflow

services:
  # -------------------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL (100% Isolado na Rede Interna do WattFlow)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wattflow_postgres
    restart: unless-stopped
    networks:
      - wattflow_isolated_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wattflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wattflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-wattflow}
    # Sem exposição de portas no host: o banco só aceita conexões da rede interna wattflow_isolated_net
    # Caso precise inspecionar via tunnel SSH local, descomente a linha abaixo:
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wattflow} -d ${POSTGRES_DB:-wattflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # -------------------------------------------------------------------------
  # 2. Aplicação WattFlow (Next.js Pages Router + Prisma)
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wattflow_app
    restart: unless-stopped
    networks:
      - wattflow_isolated_net
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Expõe apenas no loopback (127.0.0.1) em porta dedicada (padrão 3050) para evitar colisão com apps na 3000
      - "${APP_BIND_IP:-127.0.0.1}:${APP_HOST_PORT:-3050}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-wattflow}:${POSTGRES_PASSWORD:-wattflow_password}@postgres:5432/${POSTGRES_DB:-wattflow}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-wattflow}:${POSTGRES_PASSWORD:-wattflow_password}@postgres:5432/${POSTGRES_DB:-wattflow}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-wattflow_secure_production_auth_secret_key_random_64_bits_abc123}
      CRON_SECRET_TOKEN: ${CRON_SECRET_TOKEN:-wattflow_secret_token_123}
      PORT: 3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M

  # -------------------------------------------------------------------------
  # 3. Agendador Automático do Cron Job (Sync Periódico de Energia)
  # -------------------------------------------------------------------------
  cron-scheduler:
    image: alpine:latest
    container_name: wattflow_cron
    restart: unless-stopped
    networks:
      - wattflow_isolated_net
    depends_on:
      app:
        condition: service_healthy
    environment:
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-2}
      CRON_SECRET_TOKEN: ${CRON_SECRET_TOKEN:-wattflow_secret_token_123}
    command:
      - /bin/sh
      - -c
      - |
        echo "=== [WattFlow Cron] Agendador automatico iniciado ==="
        while true; do
          sleep $${SYNC_INTERVAL_SECONDS:-2}
          echo "Disparando sincronizacao de energia..."
          wget -q -O - "http://app:3000/api/sync?token=$${CRON_SECRET_TOKEN}" || echo "Falha ao acionar rota /api/sync"
          echo ""
        done
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  wattflow_isolated_net:
    name: wattflow_isolated_net
    driver: bridge

volumes:
  postgres_data:
    name: wattflow_postgres_data
